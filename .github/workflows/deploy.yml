# Build an arm64 image, push it to GHCR, and point the k3s cluster at it via k3s-gitops.
# Installed from Partharsid/k3s-gitops/ci/deploy.yml.tmpl — edit there and re-install.
name: deploy

on:
  push:
    branches: [master]
    # pushes that only touch these never change the running app, so don't rebuild for them
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP: satyasri-realtors
  IMAGE: ghcr.io/partharsid/satyasri-realtors

jobs:
  deploy:
    # Public repos get a native arm64 runner for free; private repos build arm64 under emulation.
    runs-on: ${{ github.event.repository.private && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - if: github.event.repository.private
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write build-time settings (mounted as a build secret, never stored in the image)
        env:
          DOTENV: ${{ secrets.DOTENV_PRODUCTION }}
        run: printf '%s' "$DOTENV" > "$RUNNER_TEMP/dotenv"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          secret-files: dotenv=${{ runner.temp }}/dotenv
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the cluster at the new image
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gitops && chmod 600 ~/.ssh/gitops
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts 2>/dev/null
          # GitHub's git-over-SSH has short outages ("Permission denied (publickey)" / "Internal Server
          # Error" with a valid key: 2026-11-03 and 2026-11-04). Ride them out instead of failing:
          # alternate between port 22 and ssh.github.com:443 and keep retrying for ~25 minutes.
          ssh22="ssh -i ~/.ssh/gitops -o IdentitiesOnly=yes -o ConnectTimeout=20"
          ssh443="ssh -i ~/.ssh/gitops -o IdentitiesOnly=yes -o ConnectTimeout=20 -o Hostname=ssh.github.com -o Port=443"
          pick_ssh() { if [ $(( $1 % 2 )) = 1 ]; then export GIT_SSH_COMMAND="$ssh22"; else export GIT_SSH_COMMAND="$ssh443"; fi; }
          wait_for() { local s=$(( $1 * 15 )); [ $s -gt 120 ] && s=120; echo "$2 failed (attempt $1), retrying in $s s"; sleep $s; }
          MAX=20
          for attempt in $(seq 1 $MAX); do
            pick_ssh $attempt
            git clone -q --depth 1 git@github.com:Partharsid/k3s-gitops.git gitops && break
            rm -rf gitops
            [ "$attempt" = $MAX ] && { echo "::error::could not clone k3s-gitops after $MAX attempts"; exit 1; }
            wait_for $attempt clone
          done
          cd gitops
          git config user.name "deploy-bot" && git config user.email "partharsid@users.noreply.github.com"
          for attempt in $(seq 1 $MAX); do
            pick_ssh $attempt
            sed -i "/- name: sites\/${APP}\$/{n;s#newName: .*#newName: ${IMAGE}#;n;s#newTag: .*#newTag: ${GITHUB_SHA}#}" apps/sites/kustomization.yaml
            git diff --quiet || git commit -qam "deploy ${APP} ${GITHUB_SHA::7}"
            # Success only when origin already has this tag: nothing local is waiting to be pushed.
            if [ -z "$(git log --oneline origin/main..HEAD)" ]; then echo "k3s-gitops already points at ${GITHUB_SHA::7}"; exit 0; fi
            git push -q && exit 0
            wait_for $attempt push
            # another site may have pushed meanwhile: start over from origin, re-apply the bump
            git fetch -q origin main && git reset -q --hard origin/main || true
          done
          echo "::error::could not push to k3s-gitops after $MAX attempts"
          exit 1
