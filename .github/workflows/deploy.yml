# Build an arm64 image, push it to GHCR, and point the k3s cluster at it via k3s-gitops.
# Installed from Partharsid/k3s-gitops/ci/deploy.yml.tmpl — edit there and re-install.
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP: satyasri-realtors
  IMAGE: ghcr.io/partharsid/satyasri-realtors

jobs:
  deploy:
    # Public repos get a native arm64 runner for free; private repos build arm64 under emulation.
    runs-on: ${{ github.event.repository.private && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4

      - if: github.event.repository.private
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write build-time settings (mounted as a build secret, never stored in the image)
        env:
          DOTENV: ${{ secrets.DOTENV_PRODUCTION }}
        run: printf '%s' "$DOTENV" > "$RUNNER_TEMP/dotenv"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          secret-files: dotenv=${{ runner.temp }}/dotenv
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the cluster at the new image
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gitops && chmod 600 ~/.ssh/gitops
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitops"
          git clone -q --depth 1 git@github.com:Partharsid/k3s-gitops.git gitops && cd gitops
          git config user.name "deploy-bot" && git config user.email "partharsid@users.noreply.github.com"
          # several sites can deploy at once: rebase-free retry on push conflicts
          for attempt in 1 2 3 4 5; do
            sed -i "/- name: sites\/${APP}\$/{n;s#newName: .*#newName: ${IMAGE}#;n;s#newTag: .*#newTag: ${GITHUB_SHA}#}" apps/sites/kustomization.yaml
            git commit -qam "deploy ${APP} ${GITHUB_SHA::7}" || exit 0
            git push -q && exit 0
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
