# Build an arm64 image, push it to GHCR, and point the k3s cluster at it via k3s-gitops.
# Installed from Partharsid/k3s-gitops/ci/deploy.yml.tmpl — edit there and re-install.
name: deploy

on:
  push:
    branches: [master]
    # pushes that only touch these never change the running app, so don't rebuild for them
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP: satyasri-realtors
  IMAGE: ghcr.io/partharsid/satyasri-realtors

jobs:
  deploy:
    # Public repos get a native arm64 runner for free; private repos build arm64 under emulation.
    runs-on: ${{ github.event.repository.private && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4

      - if: github.event.repository.private
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write build-time settings (mounted as a build secret, never stored in the image)
        env:
          DOTENV: ${{ secrets.DOTENV_PRODUCTION }}
        run: printf '%s' "$DOTENV" > "$RUNNER_TEMP/dotenv"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          secret-files: dotenv=${{ runner.temp }}/dotenv
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the cluster at the new image
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gitops && chmod 600 ~/.ssh/gitops
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitops -o IdentitiesOnly=yes -o ConnectTimeout=20"
          # GitHub SSH occasionally refuses a connection (2026-11-04: "Permission denied (publickey)"
          # with a valid key) — retry with backoff instead of failing the whole deploy.
          for attempt in 1 2 3 4 5; do
            git clone -q --depth 1 git@github.com:Partharsid/k3s-gitops.git gitops && break
            rm -rf gitops
            [ "$attempt" = 5 ] && { echo "::error::could not clone k3s-gitops after 5 attempts"; exit 1; }
            echo "clone failed (attempt $attempt), retrying in $((attempt * 10)) s"; sleep $((attempt * 10))
          done
          cd gitops
          git config user.name "deploy-bot" && git config user.email "partharsid@users.noreply.github.com"
          # several sites can deploy at once (and SSH can flake): retry push with backoff
          for attempt in 1 2 3 4 5; do
            sed -i "/- name: sites\/${APP}\$/{n;s#newName: .*#newName: ${IMAGE}#;n;s#newTag: .*#newTag: ${GITHUB_SHA}#}" apps/sites/kustomization.yaml
            git diff --quiet || git commit -qam "deploy ${APP} ${GITHUB_SHA::7}"
            # Success only when origin already has this tag: nothing local is waiting to be pushed.
            # (A failed push leaves the commit here, so the next attempt pushes it again instead of
            # finding "nothing to commit" and reporting a deploy that never happened.)
            if [ -z "$(git log --oneline origin/main..HEAD)" ]; then echo "k3s-gitops already points at ${GITHUB_SHA::7}"; exit 0; fi
            git push -q && exit 0
            sleep $((attempt * 15))
            # another site may have pushed meanwhile: start over from origin, re-apply the bump
            git fetch -q origin main && git reset -q --hard origin/main || true
          done
          echo "::error::could not push to k3s-gitops after 5 attempts"
          exit 1
